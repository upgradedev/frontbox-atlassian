name: Forge Deploy (UAT)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Forge environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
          - development
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: ${{ secrets.FORGE_SITE }}
      FORGE_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Guard secrets
        run: |
          test -n "$FORGE_EMAIL" || { echo "Missing FORGE_EMAIL secret"; exit 1; }
          test -n "$FORGE_API_TOKEN" || { echo "Missing FORGE_API_TOKEN secret"; exit 1; }
          test -n "$FORGE_SITE" || { echo "Missing FORGE_SITE secret (host only, e.g. example.atlassian.net)"; exit 1; }
      - name: Pre-deploy gates
        run: |
          node scripts/validate-manifest.js
          node --test
          node scripts/run_triage_eval.js
          node scripts/uat.js
      - name: Install dependencies and Forge CLI
        run: |
          npm install --ignore-scripts
          npm install --global @forge/cli@15
          forge --version
          forge settings set usage-analytics true
          forge whoami
      - name: Register app once (placeholder app.id only)
        run: |
          if grep -q '00000000-0000-4000-8000-000000000000' manifest.yml; then
            echo "Placeholder app.id found. Register once interactively (Developer Space prompt needs a TTY): forge register \"FrontBox for JSM and Confluence\" -y, commit manifest.yml, then re-run."
            exit 1
          else
            echo "App already registered, skipping register."
          fi
      - name: Forge lint
        run: forge lint
      - name: Deploy
        run: forge deploy -e "$FORGE_ENV"
      - name: Install or upgrade on UAT site (Jira required, Confluence when activated)
        run: |
          install_product() {
            forge install --non-interactive --site "$FORGE_SITE" --product "$1" -e "$FORGE_ENV" \
              || forge install --upgrade --non-interactive --site "$FORGE_SITE" --product "$1" -e "$FORGE_ENV"
          }
          echo "== jira (required) =="
          install_product jira
          echo "== confluence (required once the product is activated on the site) =="
          if install_product confluence; then
            echo "Confluence installed."
          else
            echo "::warning::Confluence install failed. If Confluence is not activated on the UAT site, an org admin must add the Confluence product first, then re-run this workflow. The Jira install above is unaffected."
          fi
          forge install list -e "$FORGE_ENV"
