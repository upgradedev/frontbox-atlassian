name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate manifest (Zero Egress, pairing, wiring)
        run: node scripts/validate-manifest.js
      - name: Unit and integration tests (dependency-free domain core)
        run: node --test
      - name: Full judge-journey UAT
        run: node scripts/uat.js
      - name: Triage evaluation harness (J3)
        run: node scripts/run_triage_eval.js
      - name: Load smoke (500 gate checks)
        run: node scripts/load-smoke.js 100
      - name: Static mirror export smoke
        run: node scripts/export-mirror.js temp/site && test -f temp/site/index.html
      - name: Install Forge dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Forge lint
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          if [ -z "$FORGE_API_TOKEN" ]; then
            echo "FORGE_API_TOKEN secret absent (fork PR). Skipping Forge lint; manifest gate already passed."
            exit 0
          fi
          if grep -q '00000000-0000-4000-8000-000000000000' manifest.yml; then
            echo "Placeholder app.id: app not registered yet. Forge lint enforces fully after registration (Forge Deploy workflow commits the real id)."
            exit 0
          fi
          npx --yes @forge/cli@15 settings set usage-analytics true
          npx --yes @forge/cli@15 lint
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start demo mirror
        run: |
          node scripts/demo-mirror.js &
          for i in $(seq 1 20); do curl -sf http://localhost:4321/healthz && break || sleep 1; done
      - name: OWASP ZAP baseline against the mirror
        run: |
          mkdir -p zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:4321/ -r zap-report.html -I
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results
          path: zap-out/zap-report.html
          if-no-files-found: warn
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
